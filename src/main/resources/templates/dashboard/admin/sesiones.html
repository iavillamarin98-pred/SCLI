<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sesiones activas - SGIL</title>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <!-- Tema global -->
  <link rel="stylesheet" th:href="@{/css/admin.css(v=2)}" href="/css/admin.css"/>

  <style>
    /* Ajustes específicos de esta vista (mínimos) */
    .table{width:100%; border-collapse:collapse}
    .table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}
    .table thead th{background:#F9FAF7}
    .muted{color:#6b7280;font-size:.9rem}
    .pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:2px 8px;margin-right:6px}
    .status-ok{color:#16a34a;font-weight:600}
    .notice-ok{
      background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0;
      padding:10px 12px; border-radius:10px; margin-bottom:12px;
    }
  </style>
</head>
<body>

  <!-- ===== Sidebar (tema global) ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="logo-section">
      <div class="logo"><i class="fas fa-sitemap"></i></div>
      <div class="logo-text">Sistema de Control<br/>de Laboratorios</div>
    </div>
    <nav class="nav-menu">
      <a class="nav-item" th:href="@{/dashboard/admin}"><i class="fas fa-home"></i> Inicio</a>
      <a class="nav-item" th:href="@{/dashboard/admin/auditorias}"><i class="fas fa-search"></i> Auditorías</a>
      <a class="nav-item active" th:href="@{/dashboard/admin/sesiones}"><i class="fas fa-sitemap"></i> Sesiones activas</a>
    </nav>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main-content" id="mainContent">
    <header class="header">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir/cerrar menú">
        <i class="fas fa-bars"></i>
      </button>

      <div class="user-section">
        <button class="user-info" id="userInfo" type="button" aria-haspopup="true" aria-expanded="false">
          <div class="user-avatar" id="userAvatar">AD</div>
          <span id="userName">Administrador</span>
          <i class="fas fa-chevron-down"></i>
        </button>
        <div class="user-dropdown" id="userDropdown" role="menu" aria-hidden="true">
          <a class="dropdown-item logout" id="logoutBtn" role="menuitem" href="#"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </div>
      </div>
    </header>

    <section class="dashboard">
      <h1 class="page-title"><i class="fas fa-sitemap"></i> Sesiones activas</h1>

      <!-- Aviso éxito (respeta tu query param ?ok=1) -->
      <div th:if="${param.ok} == '1'" class="notice-ok">Sesión expulsada.</div>

      <!-- Tarjeta con la tabla -->
      <div class="announcements-section" style="padding:0">
        <div style="overflow:auto; padding:20px;">
          <table class="table">
            <thead>
            <tr>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Última actividad</th>
              <th>IP</th>
              <th>Session ID</th>
              <th>Estado</th>
              <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${items}">
              <td th:text="${s.username}"></td>
              <td><span class="pill" th:text="${s.rol != null ? s.rol : '-'}"></span></td>
              <td th:text="${s.lastSeen != null ? #temporals.format(s.lastSeen, 'yyyy-MM-dd HH:mm:ss') : '-'}"></td>
              <td th:text="${s.ip}"></td>
              <td><code th:text="${s.sessionId}"></code></td>
              <!-- Lo que aparece está ACTIVO -->
              <td><span class="status-ok">ACTIVA</span></td>
              <td>
                <form th:action="@{/dashboard/admin/sesiones/kick}" method="post"
                      onsubmit="return confirm('¿Expulsar esta sesión?')">
                  <input type="hidden" name="sessionId" th:value="${s.sessionId}">
                  <button class="btn btn-danger" type="submit"><i class="fas fa-ban"></i> Expulsar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
              <td colspan="7" class="muted">No hay sesiones activas.</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Scripts layout ===== -->
  <script th:inline="javascript">
    const _nombre = /*[[${session.nombreUsuario}]]*/ null;
    const _rol    = /*[['' + ${session.rol}]]*/ null;
    if (_nombre) sessionStorage.setItem('nombreUsuario', _nombre);
    if (_rol)    sessionStorage.setItem('rol', _rol);
  </script>

  <script>
    // Header/Sidebar
    const menuToggle   = document.getElementById('menuToggle');
    const sidebar      = document.getElementById('sidebar');
    const mainContent  = document.getElementById('mainContent');
    const userInfo     = document.getElementById('userInfo');
    const userDropdown = document.getElementById('userDropdown');
    const userName     = document.getElementById('userName');
    const userAvatar   = document.getElementById('userAvatar');
    const logoutBtn    = document.getElementById('logoutBtn');
    const ini = n => (n||'').trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase() || 'AD';

    menuToggle?.addEventListener('click', ()=>{
      sidebar.classList.toggle('hidden');
      mainContent.classList.toggle('expanded');
    });
    userInfo?.addEventListener('click', (e)=>{
      e.stopPropagation();
      userDropdown.classList.toggle('show');
    });
    document.addEventListener('click', (e)=>{
      if(!userDropdown.contains(e.target) && !userInfo.contains(e.target)){
        userDropdown.classList.remove('show');
      }
    });
    (function(){
      const n = sessionStorage.getItem('nombreUsuario') || 'Administrador';
      userName.textContent = n;
      userAvatar.textContent = ini(n);
    })();

    // Logout
    logoutBtn?.addEventListener('click', async (e)=>{
      e.preventDefault();
      try{ await fetch('/logout',{method:'GET',credentials:'include'});}catch(_){}
      sessionStorage.clear();
      location.href='/login';
    });

    // Responsive inicial
    function handleResize(){
      if (window.innerWidth <= 768) {
        sidebar.classList.add('hidden');
        mainContent.classList.add('expanded');
      } else {
        sidebar.classList.remove('hidden');
        mainContent.classList.remove('expanded');
      }
    }
    handleResize();
    window.addEventListener('resize', handleResize);
  </script>
</body>
</html>
