<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Estudiante - SGIL</title>

  <!-- Favicon (evita WARN /favicon.ico) -->
  <link rel="icon" href="/favicon.ico">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <!-- Tema global + rompe-caché -->
  <link rel="stylesheet"
        th:href="@{/css/admin.css(v=${#dates.createNow().time})}"
        href="/css/admin.css" />

  <style>
    .badge{padding:2px 8px;border-radius:999px;font-size:.8rem}
  .badge-green{background:#e7f9ed;color:#166534}

    
    /* Tarjetas de módulos */
    .modules-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:14px}
    @media (max-width:900px){.modules-grid{grid-template-columns:repeat(2,minmax(180px,1fr))}}
    @media (max-width:600px){.modules-grid{grid-template-columns:1fr}}
    .module-card{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;text-decoration:none;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .module-card i{font-size:1.25rem}
    .module-card:hover{box-shadow:0 6px 18px rgba(16,185,129,.18)}
    .hint{font-size:.9rem;color:#6b7280}
  </style>
</head>
<body>

<!-- ===== Sidebar (tema global) ===== -->
<aside class="sidebar" id="sidebar">
  <div class="logo-section">
    <div class="logo"><i class="fas fa-graduation-cap"></i></div>
    <div class="logo-text">Sistema de Control<br/>de Laboratorios</div>
  </div>
  <nav class="nav-menu">
    <a class="nav-item active" th:href="@{/dashboard/estudiante}"><i class="fas fa-home"></i> Inicio</a>
    <!-- Enlaces ABSOLUTOS corregidos -->
    <a class="nav-item" th:href="@{/estudiante/horarios}"><i class="fas fa-calendar-alt"></i> Mis horarios</a>
    <a class="nav-item" th:href="@{/dashboard/estudiante/asistencia}"><i class="fas fa-user-check"></i> Asistencia</a>
   
  </nav>
  <div class="help-section">
    <button class="help-btn" type="button" onclick="alert('Consulta tus horarios, revisa asistencia y entérate de los anuncios del laboratorio.')">
      <i class="fas fa-question-circle"></i> Ayuda
    </button>
  </div>
</aside>

<!-- ===== Main ===== -->
<main class="main-content" id="mainContent">
  <!-- Header (tema global) -->
  <header class="header">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir/cerrar menú">
      <i class="fas fa-bars"></i>
    </button>

    <div class="user-section">
      <button class="user-info" id="userInfo" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="user-avatar" id="userAvatar">ES</div>
        <span id="userName">Estudiante</span>
        <i class="fas fa-chevron-down"></i>
      </button>
      <div class="user-dropdown" id="userDropdown" role="menu" aria-hidden="true">
        <a class="dropdown-item" role="menuitem" th:href="@{/dashboard/estudiante/perfil}"><i class="fas fa-user"></i> Mi perfil</a>
        <a class="dropdown-item" role="menuitem" th:href="@{/dashboard/estudiante/cambio-clave}"><i class="fas fa-key"></i> Cambio de clave</a>
        <a class="dropdown-item logout" id="logoutBtn" role="menuitem" href="#"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <section class="dashboard">
    <h1 class="page-title"><i class="fas fa-graduation-cap"></i> Panel Estudiante</h1>

    <!-- Accesos rápidos -->
    <div class="announcements-section">
      <div class="modules-grid">
        <!-- Enlace ABSOLUTO corregido -->
        <a class="module-card" th:href="@{/estudiante/horarios}">
          <i class="fas fa-calendar-alt"></i>
          <div>
            <div style="font-weight:600">Mis horarios</div>
            <div class="hint">Consulta tus bloques y laboratorios</div>
          </div>
        </a>
        <a class="module-card" th:href="@{/dashboard/estudiante/asistencia}">
          <i class="fas fa-user-check"></i>
          <div>
            <div style="font-weight:600">Revisar asistencia</div>
            <div class="hint">Historial y estado por materia</div>
          </div>
        </a>
        
      </div>
    </div>

    <!-- Anuncios recientes -->
    <div class="announcements-section">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h3 style="margin:0"><i class="fas fa-bullhorn"></i> Últimos avisos</h3>
    <button class="btn" id="btnFiltro" type="button"><i class="fas fa-filter"></i> Todos</button>
  </div>

  <!-- Si el backend ya inyecta `avisos` en el modelo -->
  <ul th:if="${!#lists.isEmpty(avisos)}"
      style="list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px">
    <li th:each="a : ${avisos}"
        class="card"
        style="padding:10px;border:1px solid #e5e7eb;border-radius:12px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
        <div>
          <b th:text="${a.titulo != null && !#strings.isEmpty(a.titulo) ? a.titulo : a.motivo}">Título</b>
          <div style="font-size:.9rem;color:#475569">
            <span th:text="${a.unidadSolicitante}">Unidad</span> ·
            <span th:text="${#temporals.format(a.fechaInicio, 'dd MMM')}"></span>
            —
            <span th:text="${#temporals.format(a.fechaFin, 'dd MMM yyyy')}"></span>
          </div>
        </div>
        <span th:if="${a.prioridad}" class="badge badge-green">Prioritario</span>
      </div>
      <div th:if="${a.observaciones}" style="margin-top:6px;font-size:.95rem" th:text="${a.observaciones}"></div>
    </li>
  </ul>

  <!-- Fallback por JS cuando `avisos` viene vacío o no está -->
  <div th:if="${#lists.isEmpty(avisos)}"
       id="avisosBox"
       style="margin-top:10px">
    Cargando avisos…
  </div>
</div>
  </section>
</main>

<!-- INYECTA valores de sesión de forma segura -->
<script th:inline="javascript">
  /*<![CDATA[*/
  const _nombre = /*[[${session.nombreUsuario}]]*/ null;
  const _rol    = /*[['' + ${session.rol}]]*/ null;
  if (_nombre) sessionStorage.setItem('nombreUsuario', _nombre);
  if (_rol)    sessionStorage.setItem('rol', _rol);
  /*]]>*/
</script>
<script>
  (async function cargarAvisosSiHaceFalta(){
    const box = document.getElementById('avisosBox');
    if (!box) return; // Ya vinieron por Thymeleaf

    try{
      const r = await fetch('/api/docentes/avisos', {credentials:'include'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      const data = await r.json(); // [{id,titulo,motivo,unidad,fechaInicio,fechaFin,prioridad,observaciones}]
      if (!Array.isArray(data) || data.length === 0){
        box.textContent = 'No hay notificaciones nuevas por ahora.';
        return;
      }
      box.innerHTML = data.slice(0,5).map(a => `
        <div class="card" style="padding:10px;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
            <div>
              <b>${(a.titulo && a.titulo.trim()) ? a.titulo : (a.motivo || '')}</b>
              <div style="font-size:.9rem;color:#475569">
                <span>${a.unidad ?? ''}</span> ·
                <span>${a.fechaInicio ?? ''}</span>
                —
                <span>${a.fechaFin ?? ''}</span>
              </div>
            </div>
            ${a.prioridad ? '<span class="badge badge-green">Prioritario</span>' : ''}
          </div>
          ${a.observaciones ? `<div style="margin-top:6px;font-size:.95rem">${a.observaciones}</div>` : ''}
        </div>
      `).join('');
    }catch(err){
      console.error('Avisos:', err);
      box.textContent = 'No se pudieron cargar los avisos.';
    }
  })();
</script>

<script>
  // ===== Header/Sidebar comunes =====
  const menuToggle   = document.getElementById('menuToggle');
  const sidebar      = document.getElementById('sidebar');
  const mainContent  = document.getElementById('mainContent');
  const userInfo     = document.getElementById('userInfo');
  const userDropdown = document.getElementById('userDropdown');
  const userName     = document.getElementById('userName');
  const userAvatar   = document.getElementById('userAvatar');
  const logoutBtn    = document.getElementById('logoutBtn');

  const ini = n => (n||'').trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase() || 'ES';

  menuToggle?.addEventListener('click', ()=>{ sidebar.classList.toggle('hidden'); mainContent.classList.toggle('expanded'); });
  userInfo?.addEventListener('click', (e)=>{ e.stopPropagation(); userDropdown.classList.toggle('show'); });
  document.addEventListener('click', (e)=>{ if(!userDropdown.contains(e.target) && !userInfo.contains(e.target)) userDropdown.classList.remove('show'); });

  (function(){
    const n = sessionStorage.getItem('nombreUsuario') || 'Estudiante';
    userName.textContent = n;
    userAvatar.textContent = ini(n);
  })();

  // Autorización mínima
  (function(){
    const rol=(sessionStorage.getItem('rol')||'').toLowerCase();
    if(rol!=='estudiante'){ window.location.replace('/login'); }
  })();

  // Logout
  logoutBtn?.addEventListener('click', async (e)=>{
    e.preventDefault();
    try{ await fetch('/logout',{method:'GET',credentials:'include'}) }catch(_){}
    sessionStorage.clear(); window.location.replace('/login');
  });

  // Demo filtro avisos
  document.getElementById('btnFiltro')?.addEventListener('click', ()=>{
    alert('Filtro pendiente de implementar');
  });

  // Responsive inicial
  function handleResize(){
    if (window.innerWidth <= 768) { sidebar.classList.add('hidden'); mainContent.classList.add('expanded'); }
    else { sidebar.classList.remove('hidden'); mainContent.classList.remove('expanded'); }
  }
  handleResize(); window.addEventListener('resize', handleResize);
</script>
</body>
</html>
